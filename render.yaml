services:
  - type: web
    name: lumina-ai-studio
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PORT
        value: "8090"
      - key: DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lumina-assets
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: MODEL_DEVICE_ID
        generateValue: true
      - key: APP_ORIGINS
        fromService:
          type: web
          name: lumina-ai-studio
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: GLOBAL_DAILY_GENERATION_LIMIT
        value: "12"
