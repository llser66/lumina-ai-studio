[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-studio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3", "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1", "email-validator>=2,<3",
  "Pillow>=12,<14", "httpx>=0.28,<1", "filelock>=3.20,<4",
  "cryptography>=46,<51"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
server = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
